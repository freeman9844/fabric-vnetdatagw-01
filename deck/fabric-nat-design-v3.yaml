          - {kind: line, name: legend-allow-line, x: 10, y: 453, x2: 53, y2: 453, line: "2E7D32", line_w: 2.5}
          - {kind: text, name: legend-allow-text, x: 65, y: 441, w: 212, h: 25, text: "허용 요청 · 200", size: 12, color: "444444", align: left}
          - {kind: line, name: legend-deny-line, x: 297, y: 453, x2: 340, y2: 453, line: "C62828", line_w: 2.5, dash: true}
          - {kind: text, name: legend-deny-text, x: 352, y: 441, w: 230, h: 25, text: "비허용 출발지 · 403", size: 12, color: "444444", align: left}
          - {kind: text, name: legend-scope, x: 10, y: 488, w: 1180, h: 29, text: "범위: 공개 HTTPS 수신 IP·접근 정책 (온프레미스·성능 제외)", size: 12, color: "444444", align: left}
    source: "Microsoft Learn — https://learn.microsoft.com/data-integration/vnet/data-gateway-architecture ; https://learn.microsoft.com/azure/nat-gateway/nat-overview"
    notes: |
      안녕하세요. 오늘은 Fabric Pipeline이 외부 HTTPS API를 호출할 때 목적지에서 보는 출발지 주소를 고정할 수 있는지 살펴볼게요. 실제 Azure West US 3에서 작은 구성으로 두 가지를 확인했습니다. 첫째, 정적 공인 IPv4가 수신 로그에 남는지입니다. 둘째, 다른 출발지는 같은 주소에서 거부되는지입니다.

      왼쪽의 Fabric은 고객 VNet 밖에 있는 SaaS입니다. 기존 Trial에 만든 전용 작업 영역에서 REST Copy Activity를 실행했어요. 연결을 지정하면 VNet Data Gateway가 Microsoft.PowerPlatform/vnetaccesslinks로 위임된 서브넷에서 HTTPS 요청을 보냅니다. 파란 VNet 경계 안에서 NAT Gateway는 점선 서브넷 경계 바깥에 보이죠. NAT Gateway는 서브넷에 배치한 VM이 아니라, 그 서브넷에 연결한 별도 관리형 리소스이기 때문입니다. 주황 점선은 이 연결 설정이고, 초록 실선은 요청 경로예요. Standard NAT Gateway가 정적 공인 IPv4 한 개로 출발지 주소를 바꿉니다.

      오른쪽의 App Service는 VNet 밖의 공개 HTTPS 엔드포인트지만 지정된 NAT 주소만 허용합니다. 응답은 Fabric이 Lakehouse에 적재했고, 요청 수신과 정책 판단은 Log Analytics에서 대조했어요. 빨간 점선은 같은 URL을 호출하되 NAT를 사용하지 않는 대조군입니다. 이 결과만으로 온프레미스 연결이나 처리 성능까지 판단할 수는 없어요. 이제 네트워크 검증에서 어떤 자료를 맞춰 봤는지 순서대로 보겠습니다.

  - layout: section
    section_no: "01"
    title: "네트워크 검증"
    subtitle: "고정 송신 IPv4 · /32 접근 제한 · 동일 URL 대조군"
    notes: |
      앞에서 요청 경로와 정책의 위치를 봤습니다. 이제 네트워크 검증을 보겠습니다. Fabric에서 두 번 요청했고, 그중 먼저 성공한 URL을 외부에서 다시 호출했어요. 응답 코드뿐 아니라 수신 IP와 감사 판정이 함께 맞아야 통과입니다. 먼저 검증 매트릭스에서 각 경우에 어떤 증거를 요구했는지 보겠습니다.

  - layout: content
    title: "검증 매트릭스 — 허용 2회와 차단 대조군"
    title_size: 26
    archetype: comparison-table
    covers: ["네트워크 검증"]
    blocks:
      - type: table
        id: matrix
        box: [48, 112, 1184, 272]
        columns: ["ID", "출발지", "HTTPS 요청", "기대 응답", "판정 근거"]
        col_widths: [0.07, 0.20, 0.20, 0.15, 0.38]
        row_h: 70
        size: 14
        header_fill: "0078D4"
        align: [center, left, left, center, left]
        rows:
          - ["01", "Fabric 실행 1", "GET /probe/{실행 1}", "200", "Lakehouse 일치 · 수신 IP = NAT IPv4 · Allowed"]
          - ["02", "Fabric 실행 2", "GET /probe/{실행 2}", "200", "Lakehouse 일치 · 수신 IP = NAT IPv4 · Allowed"]
          - ["03", "NAT 미사용 IPv4", "01과 같은 URL", "403", "감사 로그의 Denied · 출발지 ≠ NAT IPv4"]
      - type: cards
        id: correlation
        box: [48, 407, 1184, 160]
        columns: 3
        style: accent-top
        title_size: 15
        body_size: 13
        items:
          - {title: "호스트", body: "동일한 App Service 호스트에서 대조", color: "0078D4"}
          - {title: "경로", body: "실행별 고유 경로로 HTTP 로그를 찾고, 대조군은 01의 URL을 재사용합니다.", color: "0078D4"}
          - {title: "시간창", body: "겹치지 않는 UTC 관측 구간 3개", color: "0078D4"}
      - type: callout
        id: platform-evidence
        box: [48, 586, 1184, 66]
        style: bar
        size: 14
        text: "판정에는 플랫폼 수신 IP(CIp)를 사용합니다. 호출자가 넣은 X-Forwarded-For는 증거가 아닙니다."
    notes: |
      방금 말한 네트워크 검증을 표로 펼쳐 봤습니다. 첫 두 줄은 같은 Pipeline에서 별도로 실행한 작업이에요. 각 실행에는 고유한 프로브 경로를 부여했기 때문에 HTTP 로그에서 어떤 요청이 어느 실행인지 구분할 수 있습니다. 둘 다 완료돼 응답이 Lakehouse에 적재되어야 하고, 경로에 해당하는 수신 로그가 NAT 주소에서 온 이백 응답이어야 합니다. 같은 구간의 접근 감사에도 허용 기록이 있어야 하죠.

      세 번째 줄에서는 새 경로를 만드는 대신 첫 실행과 똑같은 URL을 사용했어요. 그래야 잘못된 URL이거나 Mock 서버에 그 경로가 없어서 실패했다는 설명을 배제할 수 있습니다. 이때 출발지만 NAT를 거치지 않는 별도 IPv4로 바꿨어요. 클라이언트가 사백삼을 받고, 감사 로그의 거부 출발지도 NAT 주소와 달라야 통과입니다.

      아래 세 항목을 보시면 자료를 연결하는 기준이 나와 있죠. 호스트는 동일해야 하고, HTTP 로그는 경로까지 맞춰야 하며, 각각의 UTC 시간창은 겹치면 안 됩니다. 감사 로그에는 프로브 경로가 없어서 이 시간창이 특히 중요해요. 출발지를 해석할 때는 요청자가 넣을 수 있는 헤더가 아니라 App Service가 기록한 CIp를 사용했습니다. 다음 장에서 실제 관측값이 이 매트릭스와 어떻게 맞았는지 보겠습니다.

  - layout: content
    title: "실측 결과 — NAT IPv4 일치와 동일 URL 차단"
    title_size: 26
    archetype: numbers
    covers: ["네트워크 검증"]
    blocks:
      - type: table
        id: results
        box: [48, 112, 1184, 272]
        columns: ["ID", "관측 시각 (UTC)", "HTTP", "수신 IP / 접근 감사", "판정"]
        col_widths: [0.07, 0.24, 0.10, 0.47, 0.12]
        row_h: 70
        size: 14
        header_fill: "0078D4"
        align: [center, left, center, left, center]
        rows:
          - ["01", "08:20:33.01263", "200", "NAT IPv4와 일치 · Allowed · Lakehouse 적재", "PASS"]
          - ["02", "08:21:31.568068", "200", "NAT IPv4와 일치 · Allowed · Lakehouse 적재", "PASS"]
          - ["03", "08:22:28.6340908", "403", "NAT와 다른 IPv4 · Denied · 01과 동일 URL", "PASS"]
      - type: cards
        id: observed
        box: [48, 405, 1184, 139]
        columns: 2
        style: accent-left
        title_size: 15
        body_size: 13
        items:
          - {title: "허용 2건 · 200 / Allowed", body: "각 프로브의 HTTP 수신 IP와 IP 감사 출발지가 NAT 주소와 일치했습니다.", color: "2E7D32"}
          - {title: "차단 1건 · 403 / Denied", body: "동일 URL의 클라이언트 응답과 다른 IPv4의 IP 감사 기록을 대조했습니다.", color: "C62828"}
      - type: callout
        id: timestamps
        box: [48, 576, 1184, 77]
        style: bar
        size: 14
        text: "01·02 시각은 App Service HTTP 로그, 03은 IP 감사 로그 기준입니다. 실제 IP와 실행 식별자는 공개하지 않습니다."
    source: "공개 실측 요약 — https://github.com/freeman9844/fabric-vnetdatagw-01/blob/main/evidence/README.md"
    notes: |
      앞에서 정의한 매트릭스에 실제 관측값을 넣으면 이렇게 됩니다. 날짜는 이천이십육 년 십일 월 이십 일이고 리전은 West US 3입니다. 표의 시각은 UTC입니다. 첫 번째 요청은 여덟 시 이십 분 삼십삼 초, 두 번째 요청은 여덟 시 이십일 분 삼십일 초에 수신됐습니다. 둘 다 이백 응답을 받았고 기록된 출발지와 고정 NAT 주소가 정확히 일치했어요. 두 Fabric 실행도 각각 완료됐고 Lakehouse 안의 프로브 식별자를 실행별로 대조했습니다.

      세 번째 줄은 여덟 시 이십이 분 이십팔 초에 기록된 접근 감사 결과입니다. 같은 URL을 별도 출발지에서 요청했을 때 클라이언트가 사백삼을 받았고, 감사 로그에도 실제로 NAT와 다른 주소가 거부된 것으로 남았어요. 앞 두 줄과 달리 이 줄의 시각은 HTTP 수신 로그가 아니라 IP 감사 로그에서 가져온 값입니다. 이 차이를 구분해야 로그가 생성되는 위치를 혼동하지 않겠죠.

      아래의 두 카드처럼 최종 두 허용 실행과 한 차단 대조군이 모두 통과했습니다. 원본 증거를 판정기에 넣어 종료 코드도 영으로 확인했어요. 겹치지 않는 시간창을 사용했기 때문에 같은 주소에 보낸 두 요청을 섞지 않았습니다. 실제 주소를 공개하지 않아도 세 관측의 일치와 불일치 관계는 확인할 수 있습니다. 이제 재현 및 정리로 넘어가, 첫 진단 실행이 왜 최종 집계에 들어가지 않았는지부터 보겠습니다.

  - layout: section
    section_no: "02"
    title: "재현 및 정리"
    subtitle: "REST Copy 설정 · 판정 절차 · 별도 승인 정리"
    notes: |
